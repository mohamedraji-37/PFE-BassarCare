<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ _('Inscription - Espace personnel') }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sign-up.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Jura:wght@400;600&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Calistoga&display=swap" rel="stylesheet">
</head>
<body>
    <a href="{{ url_for('home') }}">
        <img src="{{ url_for('static', filename='assets/home_button.png') }}" alt="{{ _('Icon') }}" class="top-left-icon">
    </a>
    <div class="container">
        <div class="left-section">
            <h1>{{ _('Explorez') }} <br> {{ _('la segmentation avancée') }}</h1>
            <img src="{{ url_for('static', filename='assets/sign-upSvg.svg') }}" alt="{{ _('Illustration') }}">
        </div>
        <div class="right-section">
            <div class="flash-messages">
                {% with messages = get_flashed_messages(with_categories=true) %}
                    {% if messages %}
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }}">{{ message }}</div>
                        {% endfor %}
                    {% endif %}
                {% endwith %}
            </div>
            <h2>{{ _("S'inscrire") }}</h2>
            <form action="{{ url_for('signup') }}" method="post">
			    <div class="name-fields">
			        <input type="text" name="first_name" placeholder="{{ _('Prenom') }}" required>
			        <input type="text" name="last_name" placeholder="{{ _('Nom') }}" required>
			    </div>
                <input type="text" name="cin" placeholder="{{ _('CIN') }}" required>
                <input type="date" name="date_of_birth" required>
			    <input type="text" name="email" placeholder="{{ _('Email') }}" required>
                <div class="password-container">
                    <input type="password" id="password" name="password" placeholder="{{ _('Mot de passe') }}" required>
                    <i class="fa-solid fa-eye toggle-password" onclick="togglePasswordVisibility()"></i>
                </div>
			    <button type="submit">{{ _("S'inscrire") }}</button>
			</form>
            <p><a href="{{ url_for('login') }}">{{ _("Vous avez deja un compte ?") }}</a></p>
        </div>
    </div>


<script>
    //script for show/hide password
function togglePasswordVisibility() {
    const passwordInput = document.getElementById('password');
    const toggleIcon = document.querySelector('.toggle-password');
    const isPassword = passwordInput.type === 'password';
    
    passwordInput.type = isPassword ? 'text' : 'password';
    toggleIcon.classList.toggle('fa-eye');
    toggleIcon.classList.toggle('fa-eye-slash');
}
</script>

<script>
    // Auto-hide flash messages after 2 seconds
    document.addEventListener('DOMContentLoaded', function() {
        const flashMessages = document.querySelectorAll('.alert');
        flashMessages.forEach(message => {
            setTimeout(() => {
                message.style.opacity = '0';
                setTimeout(() => message.remove(), 500); // Remove after fade out completes
            }, 2000); // 2 seconds
        });
    });
</script>

</body>
</html>
